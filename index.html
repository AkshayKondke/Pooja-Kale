    <script>
      (function() {
        try {
          var theme = localStorage.getItem('pk_portfolio_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
